name: Auto Renew OptikLink

on:
  schedule:
    # 官方要求每 3 天登录一次，否则 7 天删机。设置为每 2 天 UTC 7:00 (北京时间 15:00) 运行，留足缓冲期。
    - cron: '0 7 */2 * *'
  workflow_dispatch:

jobs:
  renew-optiklink:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠️ 安装依赖
        run: |
          pip install requests curl_cffi

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行保活脚本 (纯 HTTP 双轨)
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
          COOKIE: ${{ secrets.COOKIE }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 app.py

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
